version = 1

[limits]
max_file_bytes = 5_000_000
max_total_bytes = 2_000_000_000
max_entries = 100_000
max_compression_ratio = 200
nested_archive_depth = 3
max_decode_depth = 5
max_decoded_bytes = 1_000_000
max_decode_candidates_per_file = 3000
max_matches_per_rule_per_file = 50
long_line_chars = 500
entropy_threshold = 5.2
entropy_min_len = 200
base64_min_len = 40
env_value_min_len = 16
ioc_max_age_days = 45
registry_new_package_days = 90
registry_fresh_version_days = 14
registry_low_weekly_downloads = 1000

[files]
lockfiles = ["package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "bun.lock", "poetry.lock", "uv.lock", "Pipfile.lock", "Cargo.lock", "go.sum", "composer.lock", "Gemfile.lock"]
minified = ["*.min.js", "*.min.mjs", "*.min.cjs", "*.min.css", "*.map", "*-bundle.js", "*.bundle.js", "*.chunk.js"]
docs = ["*.md", "*.markdown", "*.rst", "*.adoc", "LICENSE*", "CHANGELOG*", "*.html", "*.htm"]
long_line_skip = ["*.d.ts", "*.d.mts", "*.d.cts", "*.svg", "*.json", "*.csv", "*.tsv", "*.ipynb", "*.css", "*.xml", "*.txt", "*.md"]
env_files = [".env", ".env.*", "*.env", ".config.env", "*.env.*"]
code_extensions = ["js", "mjs", "cjs", "jsx", "ts", "tsx", "mts", "cts", "py", "pyw", "pyi", "sh", "bash", "zsh", "ps1", "psm1", "bat", "cmd", "rb", "pl", "php", "go", "rs", "java", "kt", "cs", "sol", "lua", "vbs", "applescript", "swift", "c", "cc", "cpp", "h", "hpp", "vue", "svelte"]
data_extensions = ["txt", "dat", "dict", "dic", "words", "lst", "log", "csv", "tsv", "data", "cache", "tmp", "bak", "db", "bin", "res", "conf"]
code_indicator = '''\b(require\s*\(|import\s+[\w{*]+\s+from|module\.exports|function\s*\w*\s*\([^)]*\)\s*\{|=>\s*[{(]|eval\s*\(|exec\s*\(|child_process|subprocess\.|def\s+\w+\s*\(|process\.env|Buffer\.from|atob\s*\()|^#!/'''
code_indicator_min_hits = 3

[magic]
pe = "4d5a"
elf = "7f454c46"
macho = ["feedface", "feedfacf", "cefaedfe", "cffaedfe", "cafebabe"]
zip = "504b0304"
gzip = "1f8b"
bzip2 = "425a68"
xz = "fd377a585a00"
sevenzip = "377abcaf271c"
rar = "526172211a07"

[magic.extensions]
woff = ["774f4646"]
woff2 = ["774f4632"]
ttf = ["00010000", "74727565", "4f54544f"]
otf = ["4f54544f"]
eot = []
png = ["89504e47"]
jpg = ["ffd8ff"]
jpeg = ["ffd8ff"]
gif = ["47494638"]
webp = ["52494646"]
ico = ["00000100", "00000200"]
bmp = ["424d"]
pdf = ["25504446"]
zip = ["504b0304", "504b0506"]
docx = ["504b0304"]
xlsx = ["504b0304"]
pptx = ["504b0304"]
mp3 = ["494433", "fffb", "fff3", "fff2"]
mp4 = []
wasm = ["0061736d"]

[binaries]
high = ["exe", "dll", "so", "dylib", "node", "scr", "vbs", "vbe", "jse", "wsf", "wsh", "hta", "msi", "msix", "pkg", "dmg", "jar", "vsix", "appimage", "deb", "rpm", "com", "lnk", "cpl", "sys", "ocx", "iso", "img"]
medium = ["sh", "bash", "zsh", "command", "ps1", "psm1", "bat", "cmd", "applescript", "scpt", "run", "wasm"]
archives = ["zip", "tar", "tgz", "gz", "bz2", "xz", "7z", "rar", "whl", "egg", "jar", "vsix", "nupkg", "crx", "xpi"]

[commands]
dangerous = '''(?i)\b(curl|wget|iwr|Invoke-WebRequest|irm|Invoke-RestMethod|certutil|bitsadmin|Start-BitsTransfer|ncat|socat)\b|\|\s*(sudo\s+)?(sh|bash|zsh|dash|cmd(\.exe)?|powershell|pwsh|node|python[0-9.]*|perl|ruby|iex|Invoke-Expression)\b|\b(node|python[0-9.]*|deno|bun|perl|ruby)\s+(-e|-c|--eval|-)(\s|$)|base64\s+(-d|-D|--decode)|\bnohup\b|>\s*/dev/null\s+2>&1\s*&|\bosascript\b|\bmshta\b|\b[wc]script(\.exe)?\b|\brundll32\b|\bregsvr32\b|powershell[^\n]*\s-(enc|e|encodedcommand|w\s+hidden|windowstyle\s+hidden|nop|noprofile)\b|\beval\b|\bchmod\s+\+x\b|\bExpand-Archive\b'''
network_fetch = '''(?i)\b(curl|wget|iwr|Invoke-WebRequest|irm|Invoke-RestMethod|certutil|bitsadmin|Start-BitsTransfer)\b|https?://'''
interpreter = '''(?i)(^|[\s;&|"'(])(node|nodejs|python[0-9.]*|py|deno|bun|ts-node|tsx|perl|ruby|php|[wc]script|mshta|bash|sh|zsh|pwsh|powershell)(\.exe)?\s+'''

[registries]
npm_hosts = ["registry.npmjs.org", "registry.yarnpkg.com", "registry.npmmirror.com"]
pypi_hosts = ["pypi.org", "files.pythonhosted.org", "pypi.python.org"]

[npm]
consumer_install_hooks = ["preinstall", "install", "postinstall"]
install_hooks = ["preinstall", "install", "postinstall", "prepare", "preprepare", "postprepare", "prepublish", "prepack", "postpack", "dependencies"]
run_hooks = ["prestart", "start", "poststart", "predev", "dev", "pretest", "test", "posttest", "prebuild", "build", "postbuild", "preserve", "serve", "lint"]
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]
typosquat_suffixes = ["-plugin", "-config", "-utils", "-util", "-helper", "-helpers", "-core", "-lib", "-js", ".js", "js", "x", "ix", "2", "-dev", "-cli", "-sdk", "-api", "-pro", "-plus", "-next", "-ts"]

[python]
standard_build_backends = ["setuptools.build_meta", "setuptools.build_meta:__legacy__", "hatchling.build", "poetry.core.masonry.api", "poetry.masonry.api", "flit_core.buildapi", "pdm.backend", "pdm.pep517.api", "maturin", "scikit_build_core.build", "mesonpy", "uv_build", "whey", "sipbuild.api", "enscons.api"]
startup_files = ["conftest.py", "sitecustomize.py", "usercustomize.py", "setup.py", "__init__.py", "__main__.py", "noxfile.py", "tasks.py", "manage.py", "fabfile.py"]
pickle_extensions = ["pkl", "pickle", "joblib", "pt", "pth", "ckpt", "bin", "npy", "npz", "sav", "dill", "model"]
pickle_dangerous_modules = ["os", "posix", "nt", "subprocess", "builtins", "__builtin__", "sys", "socket", "shutil", "runpy", "importlib", "pty", "webbrowser", "requests", "urllib", "urllib.request", "http.client", "ctypes", "code", "codeop", "marshal", "pickle", "commands", "platform", "asyncio.subprocess"]
pickle_safe_module_prefixes = ["numpy", "torch", "collections", "sklearn", "scipy", "pandas", "xgboost", "lightgbm", "catboost", "joblib.numpy_pickle", "_codecs", "copyreg", "datetime", "builtins.set", "builtins.frozenset", "builtins.slice", "builtins.complex", "builtins.bytearray", "__builtin__.set", "torch._utils", "pathlib"]

[vscode]
trusted_publishers = ["ms-python", "ms-vscode", "ms-toolsai", "ms-azuretools", "ms-vscode-remote", "ms-dotnettools", "ms-kubernetes-tools", "ms-playwright", "github", "googlecloudtools", "dbaeumer", "esbenp", "eamodio", "redhat", "golang", "rust-lang", "bradlc", "prisma", "hashicorp", "vscjava", "vue", "svelte", "astro-build", "denoland", "biomejs", "charliermarsh", "nomicfoundation", "juanblanco", "tintinweb", "editorconfig", "streetsidesoftware", "yzhang", "christian-kohler", "formulahendry", "ritwickdey", "mikestead", "orta", "firsttris", "vitest", "jest-community", "dart-code", "anthropic", "continue", "tamasfe", "mechatroner", "graphql", "apollographql", "mongodb", "mtxr", "humao", "rangav", "gruntfuggly", "pkief", "usernamehw", "wix", "visualstudioexptteam", "angular", "nrwl", "unifiedjs", "stylelint", "foxundermoon", "timonwong", "ms-ossdata", "ms-edgedevtools", "ms-vsliveshare", "ms-ceintl", "twxs", "stripe", "docker", "codeium"]
