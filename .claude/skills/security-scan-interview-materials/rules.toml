[git]
dangerous_config = '''(?im)^\s*(fsmonitor|sshcommand|gitproxy|pager|editor|askpass|hookspath|textconv|external|clean|smudge|process|helper|program|driver|packobjectshook|cmd|command|path|uploadpack|receivepack|tool)\s*='''
dangerous_sections = '''(?im)^\s*\[\s*(alias|include|includeif|filter|diff|merge|credential|gpg|core|uploadpack|sequence|difftool|mergetool|protocol|url)\b'''
freemail_domains = ["gmail.com", "outlook.com", "hotmail.com", "yahoo.com", "proton.me", "protonmail.com", "icloud.com", "mail.ru", "yandex.ru", "qq.com", "163.com", "gmx.com", "aol.com", "zoho.com", "tutanota.com", "users.noreply.github.com"]
config_only_paths = '''^(\.vscode/|\.idea/|\.devcontainer/|\.github/|\.husky/|\.cursor/|\.claude/|\.config/|.*\.config\.[cm]?[jt]s$|\.env|.*\.env$|package\.json$|\.npmrc$|\.yarnrc|server/config/)'''
theme_keywords = '''(?i)(token.?presale|presale|\bico\b|staking|\bvault\b|coin.?locator|pet.?shop|real.?estate|property.?rental|blockchain.?game|skill.?test|test.?assess?ment|golden.?task|nft.?market|defi|dex.?aggregator|crypto.?wallet|web3)'''

[hosts]
docs_max_severity = "medium"

[[host_class]]
id = "NET-VERCEL"
regex = '''(?i)^https?://[^/]*\.vercel\.app(/|$)'''
severity = "high"
title = "Vercel-hosted URL (used to serve payloads in Contagious Interview)"

[[host_class]]
id = "NET-JSONSTORE"
regex = '''(?i)^https?://([^/]*\.)?(jsonkeeper\.com|jsonsilo\.com|npoint\.io|jsonbin\.io|extendsclass\.com|jsonblob\.com|myjson\.online|kvdb\.io|getpantry\.cloud)(/|$)'''
severity = "high"
title = "JSON storage service URL (payload staging)"

[[host_class]]
id = "NET-SHORTENER"
regex = '''(?i)^https?://([^/]*\.)?(short\.gy|bit\.ly|tinyurl\.com|is\.gd|t\.ly|rebrand\.ly|cutt\.ly|shorturl\.at|rb\.gy|tiny\.cc|ow\.ly|buff\.ly|v\.gd|s\.id|t\.co|goo\.su|clck\.ru|shorturl\.gg|urlz\.fr|qrco\.de)(/|$)'''
severity = "high"
title = "URL shortener (hides the real destination)"

[[host_class]]
id = "NET-PASTE"
regex = '''(?i)^https?://([^/]*\.)?(gist\.githubusercontent\.com|gist\.github\.com|pastebin\.com|paste\.ee|hastebin\.com|ghostbin\.\w+|rentry\.co|controlc\.com|dpaste\.\w+|termbin\.com|snippet\.host|bitbucket\.org/[^/]+/workspace/snippets|gitlab\.com/-/snippets|transfer\.sh|0x0\.st|file\.io|tmpfiles\.org|catbox\.moe)'''
severity = "high"
title = "Paste/gist/file-drop URL (runtime payload hosting)"

[[host_class]]
id = "NET-RAWGITHUB"
regex = '''(?i)^https?://(raw\.githubusercontent\.com|github\.com/[^/]+/[^/]+/raw/|objects\.githubusercontent\.com)'''
severity = "medium"
title = "Raw GitHub content URL (check what is fetched and whether it is executed)"

[[host_class]]
id = "NET-CHATOPS"
regex = '''(?i)^https?://(api\.telegram\.org/bot|([^/]*\.)?discord(app)?\.com/api/webhooks|hooks\.slack\.com/services|webhook\.site|[^/]*\.pipedream\.net|[^/]*\.requestcatcher\.com|[^/]*\.ngrok(-free)?\.(io|app|dev)|[^/]*\.trycloudflare\.com|[^/]*\.loca\.lt|[^/]*\.serveo\.net|interact\.sh|[^/]*\.oast\.\w+|[^/]*\.burpcollaborator\.net)'''
severity = "high"
title = "Bot, webhook, or tunnel endpoint (exfiltration channel)"

[[host_class]]
id = "NET-GRAPH"
regex = '''(?i)^https?://(graph\.microsoft\.com|api\.onedrive\.com|1drv\.ms|[^/]*\.sharepoint\.com|onedrive\.live\.com)'''
severity = "high"
title = "Microsoft Graph / OneDrive endpoint (used as C2 by Dream Job)"

[[host_class]]
id = "NET-IPLOOKUP"
regex = '''(?i)^https?://([^/]*\.)?(ip-api\.com|ipinfo\.io|ipify\.org|ifconfig\.me|ifconfig\.co|api\.myip\.com|icanhazip\.com|ipapi\.co|checkip\.amazonaws\.com|wtfismyip\.com|ipwho\.is|geojs\.io)'''
severity = "medium"
title = "Public IP / geolocation lookup (host fingerprinting)"

[[host_class]]
id = "NET-CHAIN"
regex = '''(?i)^https?://([^/]*\.)?(infura\.io|alchemy\.com|alchemyapi\.io|bsc-dataseed[^/]*\.(binance|bnbchain|defibit|ninicoin)\.org|bsc-dataseed\.\w+|trongrid\.io|tronscan\.org|aptoslabs\.com|ankr\.com|quiknode\.pro|etherscan\.io|bscscan\.com|polygonscan\.com|cloudflare-eth\.com|llamarpc\.com|publicnode\.com|blastapi\.io|drpc\.org|chainstack\.com|getblock\.io|mainnet\.base\.org|solana\.com|helius-rpc\.com)'''
severity = "low"
title = "Blockchain RPC / explorer endpoint (possible dead-drop resolver if responses are decoded and executed)"

[[host_class]]
id = "NET-DYNDNS"
regex = '''(?i)^https?://[^/]*\.(duckdns\.org|no-ip\.\w+|ddns\.net|hopto\.org|zapto\.org|sytes\.net|serveftp\.com|freeddns\.org|dynu\.net|ydns\.eu|ngrok\.io)(:\d+)?(/|$)'''
severity = "high"
title = "Dynamic DNS host"

[[host_class]]
id = "NET-TLD"
regex = '''(?i)^https?://[^/]*\.(xyz|top|click|icu|cyou|monster|buzz|rest|cfd|sbs|lol|quest|zip|mov|ru|su|kp|tk|ml|ga|cf|gq|pw|cc)(:\d+)?(/|$)'''
severity = "medium"
title = "Host on a TLD commonly abused for malware infrastructure"

[[pattern]]
id = "JS-FETCH-EXEC"
severity = "critical"
category = "remote-exec"
title = "Network fetch followed by dynamic code execution"
regex = '''\b(axios(\.(get|post|request))?|fetch|https?\.(get|request)|request(\.get)?|got|needle|superagent|node-fetch|undici\.request|XMLHttpRequest)\s*\([\s\S]{0,600}?\b(eval|new\s+Function|Function\s*\(|vm\.(runInThisContext|runInNewContext|runInContext|Script|compileFunction)|_compile\s*\()'''
explain = "Code downloads something and passes it to an evaluator. This is the standard Contagious Interview loader shape."

[[pattern]]
id = "JS-EVAL-RESPONSE"
severity = "critical"
category = "remote-exec"
title = "eval/Function called on a response body"
regex = '''\b(eval|Function)\s*\(\s*(\w+\.)*(data|body|text|responseText|response|res|resp|result|payload|content)\b(\.\w+)*\s*\)'''

[[pattern]]
id = "JS-EVAL"
severity = "medium"
category = "dynamic-exec"
title = "Dynamic code evaluation"
regex = '''(?<![.\w])(eval\s*\(|new\s+Function\s*\(|vm\.(runInThisContext|runInNewContext|runInContext|compileFunction)\s*\(|new\s+vm\.Script\s*\()'''

[[pattern]]
id = "JS-MODULE-COMPILE"
severity = "high"
category = "dynamic-exec"
title = "Module._compile used to run a string as a module"
regex = '''(require\s*\(\s*['"](node:)?module['"]\s*\)|\bModule\b)[\s\S]{0,200}?\._compile\s*\(|\bmodule\.constructor\b[\s\S]{0,100}?_compile'''

[[pattern]]
id = "JS-SPAWN-INLINE"
severity = "high"
category = "remote-exec"
title = "Spawns an interpreter with inline code or code piped via stdin"
regex = '''\b(spawn|spawnSync|exec|execSync|execFile|execFileSync|fork)\s*\([^;]{0,200}?['"`](node|process\.execPath|python3?)['"`][^;]{0,300}?(['"`]-e['"`]|['"`]--eval['"`]|['"`]-c['"`]|['"`]-['"`]|\binput\s*:|stdin)|process\.execPath[^;]{0,200}?(['"`]-e['"`]|['"`]--eval['"`])'''

[[pattern]]
id = "JS-DETACHED"
severity = "high"
category = "hiding"
title = "Hidden or detached child process"
regex = '''child_process[\s\S]{0,400}?(detached\s*:\s*true|windowsHide\s*:\s*true|stdio\s*:\s*['"]ignore['"]|\.unref\s*\(\s*\))'''

[[pattern]]
id = "JS-CHILD-PROCESS"
severity = "low"
category = "process"
title = "Uses child_process"
regex = '''require\s*\(\s*['"](node:)?child_process['"]\s*\)|from\s+['"](node:)?child_process['"]'''

[[pattern]]
id = "JS-RUNTIME-INSTALL"
severity = "high"
category = "dependency-evasion"
title = "Installs packages at runtime (bypasses manifest review)"
regex = '''\b(exec|execSync|spawn|spawnSync|execFile)\s*\(\s*['"`](npm|pnpm|yarn|bun)\s+(i|install|add)\b|\bnpm\s+(i|install)\s+[^'"\n]*--no-save|\bpip3?\s+install\b[^'"\n]*(--quiet|-q)\b[^'"\n]*['"`]'''

[[pattern]]
id = "JS-WRITE-THEN-RUN"
severity = "medium"
category = "dropper"
title = "Writes a file then requires or executes it"
regex = '''\b(writeFileSync|writeFile|createWriteStream)\s*\([\s\S]{0,400}?\b(require|spawn|spawnSync|fork|exec|execSync|execFile)\s*\('''

[[pattern]]
id = "JS-PROTO-FUNC"
severity = "high"
category = "dynamic-exec"
title = "Function constructor reached through a prototype chain"
regex = '''constructor\s*\.\s*constructor\s*\(|\[\s*['"]constructor['"]\s*\]\s*\[\s*['"]constructor['"]\s*\]|\(\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)\s*\.constructor'''

[[pattern]]
id = "SH-PIPE-EXEC"
severity = "critical"
category = "remote-exec"
title = "Download piped straight into an interpreter"
regex = '''(?i)\b(curl|wget)\b[^\n|]*\|\s*(sudo\s+)?(sh|bash|zsh|dash|python[0-9.]*|node|perl|ruby)\b|\b(iwr|irm|Invoke-WebRequest|Invoke-RestMethod|New-Object\s+Net\.WebClient)\b[^\n]*\|\s*(iex|Invoke-Expression)\b|\bcurl\b[^\n]*\|\s*cmd\b'''

[[pattern]]
id = "SH-DOWNLOAD-RUN"
severity = "high"
category = "remote-exec"
title = "Downloads a file then makes it executable or runs it"
regex = '''(?i)\b(curl|wget)\b[^\n]*(-o|-O|--output)[^\n]*(&&|;)[^\n]*(chmod\s+\+x|\bsh\s|\bbash\s|\bnode\s|\bpython[0-9.]*\s|\./)'''

[[pattern]]
id = "SH-NOHUP-BG"
severity = "high"
category = "hiding"
title = "Detached background process with output discarded"
regex = '''\bnohup\b[^\n]*>\s*/dev/null[^\n]*&|\bsetsid\b[^\n]*>\s*/dev/null[^\n]*&|\bdisown\b'''

[[pattern]]
id = "PS-ENCODED"
severity = "high"
category = "hiding"
title = "PowerShell with encoded command or hidden window"
regex = '''(?i)\b(powershell|pwsh)(\.exe)?\b[^\n]*\s-(enc|e|ec|encodedcommand)\s+[A-Za-z0-9+/=]{20,}|\b(powershell|pwsh)(\.exe)?\b[^\n]*\s-(w|windowstyle)\s+hidden'''

[[pattern]]
id = "WIN-LOLBIN"
severity = "high"
category = "remote-exec"
title = "Windows living-off-the-land execution binary"
regex = '''(?i)\b(mshta|rundll32|regsvr32|msiexec\s+/q|installutil|regasm|regsvcs|msbuild|wmic\s+process\s+call\s+create)(\.exe)?\b|\bcertutil(\.exe)?\s+-(urlcache|decode)|\bbitsadmin(\.exe)?\s+/transfer|\bExpand-Archive\b[\s\S]{0,200}?\b[wc]script\b'''

[[pattern]]
id = "MAC-FAKE-PROMPT"
severity = "critical"
category = "credential-theft"
title = "Fake password dialog via osascript"
regex = '''(?i)osascript[\s\S]{0,200}?(display\s+dialog|with\s+hidden\s+answer|default\s+answer)|display\s+dialog[^\n]*with\s+hidden\s+answer'''

[[pattern]]
id = "PERSIST"
severity = "high"
category = "persistence"
title = "Persistence mechanism (launch agent, cron, systemd, Run key, shell profile)"
regex = '''(?i)\blaunchctl\s+(load|bootstrap|submit)\b|Library/Launch(Agents|Daemons)|\bcrontab\s+-|/etc/cron|systemctl\s+--user\s+(enable|start)|\.config/systemd/user|\.config/autostart|HKCU\\+Software\\+Microsoft\\+Windows\\+CurrentVersion\\+Run|CurrentVersion\\+Run(Once)?\b|schtasks(\.exe)?\s+/create|(>>|appendFileSync\s*\([^)]*)\s*['"~]?[^'"\n]*\.(bashrc|zshrc|bash_profile|profile|zprofile)\b'''

[[pattern]]
id = "PERSIST-EDITOR"
severity = "high"
category = "persistence"
title = "Writes into the user's editor config directory"
regex = '''(?i)(homedir\s*\(\s*\)|expanduser\s*\(|Path\.home\s*\(|process\.env\.(HOME|USERPROFILE|APPDATA)|~)[^\n]{0,120}?['"/\\]\.?(vscode|cursor|windsurf)(['"/\\]|-server)|\.vscode/extensions|Code/User/(settings|tasks)\.json'''

[[pattern]]
id = "PY-EXEC"
severity = "medium"
category = "dynamic-exec"
title = "Python exec/eval/compile"
files = ["*.py", "*.pyw", "*.pth", "*.ipynb", "*.pyi"]
regex = '''(?<![.\w])(exec|eval)\s*\(|\bcompile\s*\([^)]*['"]exec['"]'''

[[pattern]]
id = "PY-DECODE-EXEC"
severity = "critical"
category = "dynamic-exec"
title = "Decoded or decompressed data is executed"
regex = '''\b(exec|eval)\s*\(\s*([\w.]+\s*\(\s*)*(base64\.\w*decode|b64decode|zlib\.decompress|marshal\.loads|bz2\.decompress|lzma\.decompress|codecs\.decode|bytes\.fromhex|binascii\.\w+)'''

[[pattern]]
id = "PY-OBF-LAYER"
severity = "high"
category = "obfuscation"
title = "Reverse-string plus decode layering"
regex = '''\[\s*::\s*-1\s*\][\s\S]{0,80}?(b64decode|b32decode|b85decode|decompress|fromhex)|(b64decode|decompress)\s*\([\s\S]{0,40}?\[\s*::\s*-1\s*\]'''

[[pattern]]
id = "PY-DECODERS"
severity = "low"
category = "obfuscation"
title = "Python decoding/decompression primitives"
files = ["*.py", "*.pyw", "*.pth", "*.ipynb"]
regex = '''\b(base64\.(b64decode|b85decode|a85decode|b32decode)|zlib\.decompress|marshal\.loads|bz2\.decompress|lzma\.decompress)\s*\(|codecs\.decode\([^)]*rot'''

[[pattern]]
id = "PY-DUNDER-IMPORT"
severity = "high"
category = "obfuscation"
title = "__import__ of a sensitive module"
regex = '''__import__\s*\(\s*['"](os|subprocess|socket|ctypes|base64|zlib|marshal|urllib(\.request)?|requests|http\.client|pty|shutil|platform)['"]'''

[[pattern]]
id = "PY-SUBPROCESS"
severity = "low"
category = "process"
title = "Python spawns processes"
files = ["*.py", "*.pyw", "*.pth", "*.ipynb"]
regex = '''\b(subprocess\.(Popen|run|call|check_output|check_call|getoutput)|os\.(system|popen|exec[lv]p?e?|spawn[lv]p?e?|posix_spawn))\s*\('''

[[pattern]]
id = "PY-FETCH-EXEC"
severity = "critical"
category = "remote-exec"
title = "Python network fetch followed by exec or writing a file"
regex = '''\b(urllib\.request\.urlopen|urlopen|requests\.(get|post|request)|httpx\.(get|post)|http\.client\.\w+|socket\.socket|urllib3\.\w+)\s*\([\s\S]{0,400}?((?<![.\w])(exec|eval)\s*\(|open\s*\([^)]*['"]wb?['"][\s\S]{0,300}?(subprocess|os\.system|exec|chmod))'''

[[pattern]]
id = "PY-UNSAFE-LOAD"
severity = "medium"
category = "deserialization"
title = "Unsafe deserialization (executes code from the loaded file)"
regex = '''\b(pickle|cPickle|dill|cloudpickle|_pickle)\.loads?\s*\(|\bjoblib\.load\s*\(|\btorch\.load\s*\((?![^)]*weights_only\s*=\s*True)|\byaml\.load\s*\((?![^)]*SafeLoader)|\bnp\.load\s*\([^)]*allow_pickle\s*=\s*True|\bshelve\.open\s*\('''

[[pattern]]
id = "PY-SETUP-HOOK"
severity = "high"
category = "install-hook"
title = "setup.py overrides install commands"
files = ["setup.py", "*.py"]
regex = '''\bcmdclass\s*=|class\s+\w+\s*\(\s*(install|develop|egg_info|build_py|build_ext|sdist|bdist_wheel)\s*\)'''

[[pattern]]
id = "PY-PTH-IMPORT"
severity = "critical"
category = "startup-exec"
title = ".pth line that executes code at interpreter startup"
files = ["*.pth"]
regex = '''^\s*import[\s;]'''

[[pattern]]
id = "NB-SHELL"
severity = "medium"
category = "process"
title = "Notebook shell escape or magic"
files = ["*.ipynb"]
regex = '''(^|\n|")\s*(!|%%?(bash|sh|system|script|writefile|run)\b)'''

[[pattern]]
id = "HARVEST-BROWSER"
severity = "high"
category = "credential-theft"
title = "References browser credential or cookie stores"
exclude = ["*.md", "*.txt", "*.rst"]
regex = '''(?i)Login Data\b|\bWeb Data\b|Local State\b|Local Storage[/\\]+leveldb|Local Extension Settings|Library/Application Support/(Google/Chrome|BraveSoftware|com\.operasoftware|Microsoft Edge|Firefox)|AppData[/\\]+(Local|Roaming)[/\\]+(Google|BraveSoftware|Opera Software|Microsoft[/\\]+Edge|Mozilla)|\.config/(google-chrome|BraveSoftware|chromium|opera|microsoft-edge)|Mozilla/Firefox/Profiles|\blogins\.json\b|\bkey[34]\.db\b|\bcookies\.sqlite\b'''

[[pattern]]
id = "HARVEST-KEYCHAIN"
severity = "high"
category = "credential-theft"
title = "References OS keychains or keyrings"
exclude = ["*.md", "*.txt", "*.rst"]
regex = '''(?i)login\.keychain(-db)?|Library/Keychains|security\s+(find-generic-password|find-internet-password|dump-keychain|unlock-keychain)|\bsecret-tool\s+(lookup|search)|gnome-keyring|\bkwallet|\bkeyrings?/'''

[[pattern]]
id = "HARVEST-WALLET"
severity = "high"
category = "crypto-theft"
