  '''(?<![.\w])(exec|eval)\s*\(|\bsubprocess\.|\bos\.(system|popen)\s*\(|marshal\.loads''',
]

[[combo]]
id = "HOME-WALK-UPLOAD"
severity = "critical"
category = "exfiltration"
title = "Walks the user's home directory and uploads data"
all = [
  '''(os\.homedir\s*\(\s*\)|process\.env\.(HOME|USERPROFILE)|expanduser\s*\(\s*['"]~|Path\.home\s*\(\s*\)|C:\\\\Users|os\.environ\[\s*['"](HOME|USERPROFILE))''',
  '''\b(readdirSync|readdir|walk|walkSync|scandir|os\.walk|listdir|glob|globSync|rglob)\b''',
  '''(FormData|multipart|\.post\s*\(|upload|requests\.post|axios\.post|method\s*:\s*['"]POST|\bput_object\b|sendFile)''',
]

[[combo]]
id = "ZIP-AND-SEND"
severity = "high"
category = "exfiltration"
title = "Archives files and sends them over the network"
all = [
  '''(\bzip\s+-r\b|archiver\s*\(|new\s+AdmZip|JSZip|zipfile\.ZipFile\s*\([^)]*['"]w|shutil\.make_archive|tar\s+-c)''',
  '''(FormData|multipart|\.post\s*\(|upload|requests\.post|axios\.post|method\s*:\s*['"]POST)''',
]

[[combo]]
id = "CHAIN-EXEC"
severity = "critical"
category = "c2"
title = "Blockchain data is decoded and executed (EtherHiding-style dead drop)"
all = [
  '''\b(eth_call|eth_getTransactionByHash|getTransactionByHash|getTransactionsByAddress|getTransactionInfoById|trongrid|aptoslabs|bsc-dataseed|\.call\s*\(\s*\{\s*to\s*:)''',
  '''(atob|Buffer\.from|fromCharCode|hexToString|hexToUtf8|toUtf8String|toUtf8|hexToAscii|bytes\.fromhex|decode\s*\()''',
  '''(\beval\s*\(|new\s+Function|Function\s*\(|vm\.run|_compile|\bexec\s*\(|execSync|spawn\s*\()''',
]

[[combo]]
id = "CRED-EXFIL"
severity = "critical"
category = "credential-theft"
title = "Reads credential stores and sends data out"
all = [
  '''(?i)(Login Data|Local Extension Settings|login\.keychain|\.config/solana/id\.json|wallet\.dat|logins\.json|key4\.db|Local Storage[/\\]+leveldb|\.ssh[/\\]+id_)''',
  '''(FormData|multipart|\.post\s*\(|upload|requests\.post|axios\.post|method\s*:\s*['"]POST|socket\.emit|\.send\s*\()''',
]

