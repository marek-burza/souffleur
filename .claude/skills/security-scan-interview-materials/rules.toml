regex = '''(?i)\.config/solana/id\.json|\bwallet\.dat\b|\bExodus[/\\]+(exodus\.wallet|Local Storage)|\bElectrum[/\\]+wallets|Ledger Live|atomic[/\\]+Local Storage|com\.liberty\.jaxx|Guarda[/\\]|\bMetaMask[/\\]|\bkeystore[/\\]+UTC--'''

[[pattern]]
id = "HARVEST-SEED"
severity = "medium"
category = "crypto-theft"
title = "References seed or recovery phrases"
exclude = ["*.md", "*.txt", "*.rst"]
regex = '''(?i)\b(seed|recovery|secret)[ _-]?phrase\b|\bmnemonic\b'''

[[pattern]]
id = "HARVEST-SECRETS"
severity = "high"
category = "credential-theft"
title = "References developer credential files"
exclude = ["*.md", "*.txt", "*.rst", ".gitignore", ".dockerignore", ".npmignore"]
regex = '''(?i)\.ssh[/\\]+(id_\w+|known_hosts|authorized_keys|config)\b|\.aws[/\\]+credentials|\.git-credentials|\.docker[/\\]+config\.json|\.kube[/\\]+config|\.pypirc|\.netrc|\.config[/\\]+gcloud|\.azure[/\\]|[/\\]\.npmrc\b|\.kdbx\b|1Password|\bBitwarden\b|\bKeePass'''

[[pattern]]
id = "HARVEST-ENV-SCAN"
severity = "high"
category = "credential-theft"
title = "Searches the filesystem for .env or key files"
regex = '''(?i)\b(readdirSync|readdir|walk|walkSync|scandir|os\.walk|listdir|glob|globSync|rglob|fast-glob|find\s+[~/])[\s\S]{0,300}?(\.env\b|id_rsa|\.pem\b|\.key\b|\.kdbx|wallet|\.ldb\b|\.sqlite\b)'''

[[pattern]]
id = "HARVEST-EXT-ID"
severity = "high"
category = "crypto-theft"
