min_count = 5

[[pattern]]
id = "OB-CHARCODE"
severity = "medium"
category = "obfuscation"
title = "Character-code string building"
regex = '''String\.fromCharCode\s*\(|\bchr\s*\(\s*\d+\s*\)\s*\+'''
