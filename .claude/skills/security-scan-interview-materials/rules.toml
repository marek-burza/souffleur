[[pattern]]
id = "RECON-HOST"
severity = "high"
category = "recon"
title = "Host fingerprinting followed by sending data out"
regex = '''\bos\.(hostname|userInfo|networkInterfaces|platform|release|homedir)\s*\(\s*\)[\s\S]{0,400}?\b(post|upload|send|emit|write|request|FormData)\b|\b(platform\.node|socket\.gethostname|getpass\.getuser|uuid\.getnode)\s*\(\s*\)[\s\S]{0,400}?\b(post|send|urlopen|request)\b'''

[[pattern]]
id = "RECON-VM"
severity = "high"
category = "evasion"
