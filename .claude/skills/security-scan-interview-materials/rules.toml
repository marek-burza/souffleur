[[pattern]]
id = "PI-SUPPRESS"
severity = "high"
category = "prompt-injection"
title = "Asks the reader not to report or inspect something"
regex = '''(?i)\b(do not|don't|never|no need to|you (should|must) not)\s+(report|flag|mention|scan|analy[sz]e|inspect|look at|review|warn|alert|open|read|check)\b[^\n]{0,60}\b(file|folder|this|code|directory|config|task|\.vscode|finding|issue|security|malware)'''

[[pattern]]
id = "PI-RUN-REQUEST"
severity = "medium"
category = "prompt-injection"
