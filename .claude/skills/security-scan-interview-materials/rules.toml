[[pattern]]
id = "OB-ATOB-EXEC"
severity = "high"
category = "obfuscation"
title = "Base64 decode feeding execution or network"
regex = '''\b(atob|Buffer\.from)\s*\([^)]*\)[\s\S]{0,200}?\b(eval|Function|require|exec|execSync|spawn|axios|fetch|https?\.get)\b|\b(eval|Function|require|execSync|exec)\s*\(\s*(atob|Buffer\.from)\s*\('''

[[pattern]]
id = "PI-IGNORE"
severity = "high"
