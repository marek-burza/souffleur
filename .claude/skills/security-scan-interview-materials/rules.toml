regex = '''(?i)\b(ignore|disregard|forget|override|bypass)\b[^\n]{0,40}\b(all|any|the|previous|prior|above|earlier|your|system)\b[^\n]{0,30}\b(instructions?|prompts?|rules|guidelines|guardrails|context|directives)\b'''

[[pattern]]
id = "PI-ADDRESS-AI"
severity = "high"
category = "prompt-injection"
