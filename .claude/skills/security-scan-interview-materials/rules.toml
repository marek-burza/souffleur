[[pattern]]
id = "PI-KEYWORDS"
severity = "medium"
category = "prompt-injection"
title = "Prompt-injection vocabulary"
regex = '''(?i)\b(system prompt|jailbreak|developer mode|new instructions|updated instructions|hidden instructions|end of (document|file|context)|begin (system|admin) (message|override))\b'''

[[pattern]]
id = "PI-HTML-COMMENT"
severity = "high"
category = "prompt-injection"
title = "Hidden HTML/Markdown comment containing instructions"
files = ["*.md", "*.markdown", "*.html", "*.htm", "*.mdx", "*.svg", "*.xml", "*.rst"]
regex = '''(?is)<!--(?:(?!-->).){0,4000}?\b(ai|llm|assistant|agent|claude|copilot|cursor|instructions?|ignore|execute|run the|you must|you should)\b(?:(?!-->).){0,4000}?-->'''

[[combo]]
id = "PY-STARTUP-NET"
severity = "high"
category = "startup-exec"
title = "Python file that runs automatically (pytest, interpreter startup, pip install) makes network or process calls"
files = ["conftest.py", "sitecustomize.py", "usercustomize.py", "setup.py", "*.pth", "noxfile.py"]
