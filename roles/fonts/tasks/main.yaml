---
- name: Fonts - JetBrains Mono directory
  ansible.builtin.file:
    path: /usr/local/share/fonts/jetbrains_mono
    state: directory
    mode: "0755"

- name: Fonts - JetBrains Mono archive
  ansible.builtin.tempfile:
    state: file
    prefix: JetBrainsMono.
    suffix: .zip
  register: fonts_jetbrains_mono_zip

- name: Fonts - JetBrains Mono fetch
  ansible.builtin.get_url:
    url: https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
    dest: "{{ fonts_jetbrains_mono_zip.path }}"
    force: true
    mode: "0600"

- name: Fonts - JetBrains Mono installation
  ansible.builtin.unarchive:
    src: "{{ fonts_jetbrains_mono_zip.path }}"
    dest: /usr/local/share/fonts/jetbrains_mono
    remote_src: true
    include:
      - fonts/ttf/*
    extra_opts:
      - -j

- name: Fonts - JetBrains Mono archive cleanup
  ansible.builtin.file:
    path: "{{ fonts_jetbrains_mono_zip.path }}"
    state: absent

- name: Fonts - DejaVu directory
  ansible.builtin.file:
    path: /usr/local/share/fonts/dejavu
    state: directory
    mode: "0755"

- name: Fonts - DejaVu archive
  ansible.builtin.tempfile:
    state: file
    prefix: DejaVuSans.
    suffix: .zip
  register: fonts_dejavu_zip

- name: Fonts - DejaVu fetch
  ansible.builtin.get_url:
    url: https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip
    dest: "{{ fonts_dejavu_zip.path }}"
    force: true
    mode: "0600"

- name: Fonts - DejaVu installation
  ansible.builtin.unarchive:
    src: "{{ fonts_dejavu_zip.path }}"
    dest: /usr/local/share/fonts/dejavu
    remote_src: true
    include:
      - dejavu-fonts-ttf-2.37/ttf/DejaVuSans-Oblique.ttf
      - dejavu-fonts-ttf-2.37/ttf/DejaVuSans-BoldOblique.ttf
    extra_opts:
      - -j

- name: Fonts - DejaVu archive cleanup
  ansible.builtin.file:
    path: "{{ fonts_dejavu_zip.path }}"
    state: absent

- name: Fonts - Reload
  ansible.builtin.command: fc-cache -f -v
