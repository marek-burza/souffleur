---
name: GitHub CodeQL
on: [push]
jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: actions,python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.0
        id: analyze
        with:
          upload: never
          upload-database: false
      - name: Fail on findings
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          jq -r '.runs[].results[]
            | .locations[0].physicalLocation as $loc
            | "\($loc.artifactLocation.uri):\($loc.region.startLine): \(.ruleId): \(.message.text)"' \
            "$SARIF_DIR"/*.sarif | tee findings.txt
          test ! -s findings.txt
