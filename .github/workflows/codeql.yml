---
name: GitHub CodeQL
on: [push]
jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: python
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4.37.7
        with:
          # The repo is private, and code scanning is unavailable for private repos on personal accounts
          upload: never
      - name: Fail on findings
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          jq -r '.runs[].results[]
            | .locations[0].physicalLocation as $loc
            | "\($loc.artifactLocation.uri):\($loc.region.startLine): \(.ruleId): \(.message.text)"' \
            "$SARIF_DIR"/*.sarif | tee findings.txt
          test ! -s findings.txt
