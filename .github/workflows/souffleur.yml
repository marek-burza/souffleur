---
name: Souffleur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: VAD
        run: pnpm check:vad
      - name: Build
        run: pnpm build
      - name: Upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
